---
- name: Verify SELinux state on RHEL-compatible Incus target
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check SELinux mode
      ansible.builtin.command: getenforce
      register: verify_selinux
      changed_when: false

    - name: Assert SELinux is in enforcing mode
      ansible.builtin.assert:
        that:
          - verify_selinux.stdout | lower == "enforcing"
        fail_msg: "SELinux is not enforcing (got: {{ verify_selinux.stdout }})"
        success_msg: "SELinux is enforcing as expected."

    - name: Record successful meaningful Heavy verification
      ansible.builtin.copy:
        content: "selinux-rhel9 verified\n"
        dest: >-
          {{
            lookup('ansible.builtin.env', 'MOLECULE_TEST_SUCCESS_MARKER')
            | default('/tmp/selinux-rhel9-heavy.passed', true)
          }}
        mode: "0600"
      delegate_to: localhost
      become: false
