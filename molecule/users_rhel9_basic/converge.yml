---
- name: Converge rhel.users
  hosts: all
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    users_manage_groups: true
    users_accounts:
      - name: lit-molecule-global-user
        state: present
        passwordless_sudo: false
        sudoers_name: 90-lit-molecule-global-user
      - name: ops-admin
        uid: 1001
        groups: ["wheel"]
        shell: /bin/bash
        ssh_keys:
          - >-
            ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDemoKeyForTestingOnly ops-admin
      - name: temp-user
        state: absent
        remove: true
    users_accounts_global:
      - name: lit-molecule-global-user
        state: present
        create_home: true
        password_lock: true
        passwordless_sudo: true
        sudoers_name: 90-lit-molecule-global-user
  pre_tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          dnf -y install python3
        fi
      changed_when: false

    - name: Install sudo for sudoers validation in the minimal test image
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Create sudoers include directory for the minimal test image
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        owner: root
        group: root
        mode: "0750"

  roles:
    - role: lit.rhel.users
